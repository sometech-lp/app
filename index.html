<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="美容師・美容学生がCMYでヘアカラーを学べる、染めテクの学習アプリ（テスト版）。">
  <!-- テスト配布の間は検索エンジンに載せない。一般公開するときに外す。 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11151C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="染めテク">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>染めテク</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* アプリと同じ背景色にして、読み込み中に白い画面が出ないようにする */
    html, body { margin: 0; height: 100%; background: #11151C; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #B5B9C6;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 14px; letter-spacing: 0.08em;
    }
    #loading img { width: 88px; height: 88px; border-radius: 22px; }
  </style>
</head>
<body>
  <!-- Flutter の最初の画面が出たら消す読み込み表示 -->
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>読み込み中…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
