<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="美容師・美容学生がCMYでヘアカラーを学べる、染めテクの学習アプリ（テスト版）。">
  <!-- テスト配布の間は検索エンジンに載せない。一般公開するときに外す。 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11151C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="染めテク">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>染めテク</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* アプリと同じ背景色にして、読み込み中に白い画面が出ないようにする */
    html, body { margin: 0; height: 100%; background: #11151C; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #B5B9C6;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 14px; letter-spacing: 0.08em;
    }
    #loading img { width: 88px; height: 88px; border-radius: 22px; }
  </style>
</head>
<body>
  <!-- Flutter の最初の画面が出たら消す読み込み表示 -->
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>読み込み中…</div>
  </div>
  <script>
    // ミニゲームの音（ブラウザ版だけ）。Dart 側は lib/utils/web_audio_web.dart から呼ぶ。
    // HTML の audio 要素は iPhone の Safari で1音ごとに遅く、重ねても鳴らないため、
    // Web Audio で読み込み済みの音を毎回新しく鳴らす（何音でも重ねられ、画面を止めない）。
    window.sometechAudio = (function () {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      var ctx = new Ctx();
      var master = ctx.createGain();
      master.connect(ctx.destination);
      var buffers = {};
      var bgm = { name: null, volume: 1, source: null, gain: null, startedAt: 0, offset: 0 };

      // iPhone は画面に触れたときにしか音を出し始められないので、触れるたびに再開を試す。
      function unlock() { if (ctx.state !== 'running') ctx.resume(); }
      ['touchend', 'pointerup', 'keydown'].forEach(function (type) {
        document.addEventListener(type, unlock, true);
      });

      function stopSource() {
        if (bgm.source) {
          try { bgm.source.stop(); } catch (e) {}
          bgm.source.disconnect();
          bgm.source = null;
        }
      }

      function startBgm(offset) {
        var buffer = buffers[bgm.name];
        if (!buffer) return;
        stopSource();
        var source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        bgm.gain = ctx.createGain();
        bgm.gain.gain.value = bgm.volume;
        source.connect(bgm.gain).connect(master);
        bgm.offset = offset % buffer.duration;
        bgm.startedAt = ctx.currentTime;
        source.start(0, bgm.offset);
        bgm.source = source;
      }

      return {
        // 音を読み込む。読み込めたら true。
        load: function (name, url) {
          return fetch(url)
            .then(function (r) { return r.arrayBuffer(); })
            .then(function (data) {
              return new Promise(function (resolve, reject) {
                ctx.decodeAudioData(data, resolve, reject);
              });
            })
            .then(function (buffer) { buffers[name] = buffer; return true; })
            .catch(function () { return false; });
        },
        play: function (name, volume) {
          var buffer = buffers[name];
          if (!buffer) return;
          unlock();
          var source = ctx.createBufferSource();
          source.buffer = buffer;
          var gain = ctx.createGain();
          gain.gain.value = volume;
          source.connect(gain).connect(master);
          source.start();
        },
        // BGM を最初から流す。
        restartBgm: function (name, volume) {
          bgm.name = name;
          bgm.volume = volume;
          unlock();
          startBgm(0);
        },
        // 一時停止。再開時は続きから。
        pauseBgm: function () {
          if (!bgm.source) return;
          var buffer = buffers[bgm.name];
          bgm.offset = (bgm.offset + ctx.currentTime - bgm.startedAt) % buffer.duration;
          stopSource();
        },
        resumeBgm: function () {
          if (bgm.name && !bgm.source) startBgm(bgm.offset);
        },
        stopBgm: function () { stopSource(); bgm.offset = 0; },
        setMuted: function (muted) { master.gain.value = muted ? 0 : 1; }
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
