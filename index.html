<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="美容師・美容学生がCMYでヘアカラーを学べる、染めテクの学習アプリ（テスト版）。">
  <!-- テスト配布の間は検索エンジンに載せない。一般公開するときに外す。 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11151C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="染めテク">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SOMETECH</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google アナリティクス（GA4）：利用者数とその推移を見るため（2026-10-16 オーナー指定）。
       管理画面は https://analytics.google.com 。手元の確認（localhost など）は数えない。 -->
  <script>
    (function () {
      var measurementId = 'G-47EDNJZV62'; // GA4 の測定ID（プロパティ「染めテクアプリ」のストリーム「染めテク Web」）
      var host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return;
      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
      document.head.appendChild(tag);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', measurementId);
    })();
  </script>

  <style>
    /* アプリと同じ背景色にして、読み込み中に白い画面が出ないようにする */
    html, body { margin: 0; height: 100%; background: #11151C; }
    /* 長押しで iPhone の Safari の拡大鏡・文字選択・長押しメニューが出ないようにする
       （ミニゲームの矢印を押し続けると拡大鏡が出て、指を離しても機体が動き続けた。2026-10-11） */
    html, body, body *:not(input):not(textarea) {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #B5B9C6;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 14px; letter-spacing: 0.08em;
    }
    /* 背景の四角がない透過のロゴ（2026-10-11 オーナー指定。ランチャーアイコン風の四角は出さない） */
    #loading img { width: 88px; height: 88px; }
  </style>
</head>
<body>
  <!-- Flutter の最初の画面が出たら消す読み込み表示 -->
  <div id="loading">
    <img src="icons/loading-logo.png" alt="">
    <div>読み込み中…</div>
  </div>
  <script>
    // SharedPreferences uses the flutter. prefix on the web. Read only the
    // language preference so the loading message matches the saved selection.
    (function () {
      var language = 'ja';
      try {
        var saved = localStorage.getItem('flutter.sometech_language_v1');
        if (saved) language = JSON.parse(saved);
      } catch (_) {}
      if (language === 'en') {
        document.documentElement.lang = 'en';
        document.querySelector('#loading div').textContent = 'Loading…';
      } else if (language === 'zh_Hant') {
        document.documentElement.lang = 'zh-Hant';
        document.querySelector('#loading div').textContent = '載入中…';
      }
    })();
  </script>
  <script>
    // ブラウザ版の音（ミニゲームの効果音・BGM と、アプリ全体の BGM）。
    // Dart 側は lib/utils/web_audio_web.dart から呼ぶ。
    // HTML の audio 要素は iPhone の Safari で1音ごとに遅く、重ねても鳴らないため、
    // Web Audio で読み込み済みの音を毎回新しく鳴らす（何音でも重ねられ、画面を止めない）。
    // 音は「game」（ミニゲーム）と「app」（アプリ全体の BGM）の2系統に分け、消音も別々にする。
    window.sometechAudio = (function () {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      var ctx = new Ctx();
      var groups = {};
      function group(name) {
        if (!groups[name]) {
          groups[name] = ctx.createGain();
          groups[name].connect(ctx.destination);
        }
        return groups[name];
      }
      var buffers = {};
      // 系統ごとの BGM（ループ）の状態。
      var bgms = {};

      // iPhone は画面に触れたときにしか音を出し始められないので、触れるたびに再開を試す。
      function unlock() { if (ctx.state !== 'running') ctx.resume(); }
      ['touchend', 'pointerup', 'keydown'].forEach(function (type) {
        document.addEventListener(type, unlock, true);
      });

      function bgmOf(channel) {
        if (!bgms[channel]) {
          bgms[channel] = { name: null, volume: 1, source: null, startedAt: 0, offset: 0 };
        }
        return bgms[channel];
      }

      function stopSource(bgm) {
        if (bgm.source) {
          try { bgm.source.stop(); } catch (e) {}
          bgm.source.disconnect();
          bgm.source = null;
        }
      }

      function startBgm(channel, offset) {
        var bgm = bgmOf(channel);
        var buffer = buffers[bgm.name];
        if (!buffer) return;
        stopSource(bgm);
        var source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        var gain = ctx.createGain();
        gain.gain.value = bgm.volume;
        source.connect(gain).connect(group(channel));
        bgm.offset = offset % buffer.duration;
        bgm.startedAt = ctx.currentTime;
        source.start(0, bgm.offset);
        bgm.source = source;
      }

      return {
        // 音を読み込む。読み込めたら true。同じ名前は読み込み直さない。
        load: function (name, url) {
          if (buffers[name]) return Promise.resolve(true);
          return fetch(url)
            .then(function (r) { return r.arrayBuffer(); })
            .then(function (data) {
              return new Promise(function (resolve, reject) {
                ctx.decodeAudioData(data, resolve, reject);
              });
            })
            .then(function (buffer) { buffers[name] = buffer; return true; })
            .catch(function () { return false; });
        },
        // 効果音（ミニゲーム）。
        play: function (name, volume) {
          var buffer = buffers[name];
          if (!buffer) return;
          unlock();
          var source = ctx.createBufferSource();
          source.buffer = buffer;
          var gain = ctx.createGain();
          gain.gain.value = volume;
          source.connect(gain).connect(group('game'));
          source.start();
        },
        // BGM を最初から流す。
        restartBgm: function (channel, name, volume) {
          var bgm = bgmOf(channel);
          bgm.name = name;
          bgm.volume = volume;
          unlock();
          startBgm(channel, 0);
        },
        // 一時停止。再開時は続きから。
        pauseBgm: function (channel) {
          var bgm = bgmOf(channel);
          if (!bgm.source) return;
          var buffer = buffers[bgm.name];
          bgm.offset = (bgm.offset + ctx.currentTime - bgm.startedAt) % buffer.duration;
          stopSource(bgm);
        },
        resumeBgm: function (channel) {
          var bgm = bgmOf(channel);
          if (bgm.name && !bgm.source) startBgm(channel, bgm.offset);
        },
        stopBgm: function (channel) {
          var bgm = bgmOf(channel);
          stopSource(bgm);
          bgm.offset = 0;
        },
        setMuted: function (channel, muted) { group(channel).gain.value = muted ? 0 : 1; }
      };
    })();

    // 画面に触れている指の数と、ミニゲーム中の長押し操作の無効化。
    // Dart 側は lib/utils/web_touch_web.dart から呼ぶ。
    // ブラウザが「指を離した」を Flutter に届け損ねると、ミニゲームの機体が動き続けた（2026-10-14）。
    // touch イベントの touches の数（実際に触れている指の数）と照らして、届かなかった指を忘れる。
    // count は一度も指が触れていなければ -1。
    window.sometechTouch = (function () {
      var count = -1;
      var locked = false;
      function sync(e) { count = e.touches ? e.touches.length : 0; }
      var options = { capture: true, passive: false };
      window.addEventListener('touchstart', function (e) {
        sync(e);
        // ミニゲーム中は、長押しの拡大鏡・文字選択・メニューを出さない。
        // （Flutter は pointer イベントで押し判定をするので、ここを止めても操作は効く）
        if (locked && e.cancelable) e.preventDefault();
      }, options);
      window.addEventListener('touchmove', sync, { capture: true, passive: true });
      window.addEventListener('touchend', sync, { capture: true, passive: true });
      window.addEventListener('touchcancel', sync, { capture: true, passive: true });
      return {
        count: function () { return count; },
        lock: function (on) { locked = !!on; }
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="releases/cf242e385c05a196/flutter_bootstrap.js" async></script>
</body>
</html>
